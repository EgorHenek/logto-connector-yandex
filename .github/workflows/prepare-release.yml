name: Prepare release PR

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  checks:
    name: Check, test and build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check package
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

  prepare:
    name: Prepare release changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Bump package version from Conventional Commits
        id: version
        run: |
          set -euo pipefail
          version="$(git-cliff --config cliff.toml --bumped-version)"
          version="${version#v}"
          pnpm version "$version" --no-git-tag-version --no-git-checks --no-commit-hooks
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch CHANGELOG.md
          git-cliff \
            --config cliff.toml \
            --unreleased \
            --tag "v${{ steps.version.outputs.version }}" \
            --prepend CHANGELOG.md \
            --verbose

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: release/v${{ steps.version.outputs.version }}
          delete-branch: true
          title: "chore(release): prepare v${{ steps.version.outputs.version }}"
          commit-message: "chore(release): prepare v${{ steps.version.outputs.version }}"
          body: |
            Подготовка релиза `v${{ steps.version.outputs.version }}`.

            Изменения:
            - обновлена версия в `package.json`;
            - сгенерирован `CHANGELOG.md` через git-cliff.

            После слияния PR workflow автоматически создаст тег, GitHub Release и опубликует пакет в npm.
